<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia Profesional</title>
    <!-- Librería de Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* Hermoso fondo con degradado moderno */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px; 
            margin: 0; 
        }
        .card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            padding: 30px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.25); 
            width: 100%;
            max-width: 380px; 
            text-align: center; 
        }
        h2 { color: #1e3c72; margin-bottom: 5px; font-size: 24px; }
        .subtitle { font-size: 14px; color: #666; margin-bottom: 25px; }
        
        input[type="text"] { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border: 2px solid #e1e1e1; 
            border-radius: 10px; 
            font-size: 16px; 
            text-align: center; 
            font-weight: bold; 
            color: #333; 
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #2a5298; }
        
        /* BOTÓN CIRCULAR DE CÁMARA ESTILIZADO */
        .camera-container { margin: 25px 0; }
        #fotoInput { display: none; }
        .camera-btn {
            width: 95px;
            height: 95px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,114,255,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 4px solid #fff;
        }
        .camera-btn:active { transform: scale(0.93); box-shadow: 0 2px 8px rgba(0,114,255,0.4); }
        .camera-btn svg { width: 42px; height: 42px; fill: white; }
        
        #previewText { font-size: 13px; color: #555; margin-top: 8px; font-weight: 500; }

        .btn-enviar { 
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            padding: 15px; 
            border-radius: 10px; 
            font-size: 16px; 
            margin-top: 10px; 
            box-shadow: 0 6px 15px rgba(40,167,69,0.3);
            transition: opacity 0.3s;
        }
        .btn-enviar:active { transform: scale(0.98); }
        .btn-enviar:disabled { background: #e0e0e0; color: #999; box-shadow: none; cursor: not-allowed; }

        /* Estilos de los Pop-up Modales */
        .modal-overlay { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; padding: 30px 20px; border-radius: 16px; width: 100%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: popUp 0.3s ease-in-out; }
        @keyframes popUp { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-content h3 { margin-top: 0; font-size: 22px; }
        .modal-content p { color: #555; font-size: 14px; line-height: 1.5; margin: 15px 0 25px 0; }
        .btn-cerrar { background: #007bff; padding: 12px; width: 100%; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-alerta { background: #dc3545; }
    </style>
</head>
<body>

<div class="card">
    <h2>Control de Asistencia</h2>
    <div class="subtitle">Registra tu jornada de manera segura</div>
    
    <input type="text" id="nombreTrabajador" placeholder="Tu Nombre Completo" required>
    
    <!-- BOTÓN CIRCULAR DE CÁMARA -->
    <div class="camera-container">
        <label for="fotoInput" class="camera-btn">
            <svg viewBox="0 0 24 24">
                <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3Z"/>
            </svg>
        </label>
        <input type="file" accept="image/*" capture="user" id="fotoInput" onchange="fotoTomada()">
        <div id="previewText">📸 Toca para tomar tu foto</div>
    </div>
    
    <button id="btnEnviar" class="btn-enviar" onclick="registrarAsistencia()" disabled>Registrar Asistencia</button>
    
    <p id="mensaje" style="font-weight: bold; font-size: 14px; margin-top: 12px; color: #2a5298;"></p>
</div>

<!-- POP-UP DE ÉXITO -->
<div id="modalExito" class="modal-overlay">
    <div class="modal-content">
        <h3 id="tituloModal">¡Registro Exitoso!</h3>
        <p id="textoModal">Procesando...</p>
        <button class="btn-cerrar" onclick="cerrarModal()">Aceptar</button>
    </div>
</div>

<!-- POP-UP DE AVISO / DUPLICADO -->
<div id="modalAviso" class="modal-overlay">
    <div class="modal-content">
        <h3 style="color: #dc3545;">⚠️ Aviso Importante</h3>
        <p id="textoAviso">Ya registraste asistencia recientemente.</p>
        <button class="btn-cerrar btn-alerta" onclick="cerrarAviso()">Entendido</button>
    </div>
</div>

<script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwaeELreFAlOLTzXKDODUYgLYakXjnUxCSD9fLeXYGPI12KQNP-WFqlAYhLdIFaFFexUg/exec";

    window.onload = function() {
        const nombreGuardado = localStorage.getItem("nombreTrabajador");
        if (nombreGuardado) {
            document.getElementById("nombreTrabajador").value = nombreGuardado;
        }
    };

    function fotoTomada() {
        const fileInput = document.getElementById("fotoInput");
        const previewText = document.getElementById("previewText");
        const btnEnviar = document.getElementById("btnEnviar");

        if (fileInput.files.length > 0) {
            previewText.style.color = "#28a745";
            previewText.innerText = "✅ ¡Foto lista para enviar!";
            btnEnviar.disabled = false;
        }
    }

    function registrarAsistencia() {
        const nombre = document.getElementById("nombreTrabajador").value.trim();
        const fileInput = document.getElementById("fotoInput");
        const mensaje = document.getElementById("mensaje");
        const btnEnviar = document.getElementById("btnEnviar");

        if (!nombre) {
            alert("Por favor ingresa tu nombre.");
            return;
        }
        if (fileInput.files.length === 0) {
            alert("Debes tomar una foto.");
            return;
        }

        localStorage.setItem("nombreTrabajador", nombre);

        btnEnviar.disabled = true;
        mensaje.innerText = "⚡ Procesando y enviando...";

        const file = fileInput.files[0];
        const reader = new FileReader();
        
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const MAX_WIDTH = 800;
                const MAX_HEIGHT = 800;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                    if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);

                const base64String = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                
                const datos = {
                    trabajador: nombre,
                    gps: "No requerido",
                    fotoBase64: base64String,
                    mimeType: "image/jpeg",
                    nombreArchivo: "asistencia_" + Date.now() + ".jpg"
                };

                enviarServidor(datos);
            }
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function enviarServidor(datos) {
        const mensaje = document.getElementById("mensaje");
        const btnEnviar = document.getElementById("btnEnviar");

        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            body: JSON.stringify(datos)
        })
        .then(response => response.json())
        .then(resultado => {
            mensaje.innerText = "";
            btnEnviar.disabled = false;

            if (resultado.status === "error") {
                document.getElementById("textoAviso").innerText = resultado.message;
                document.getElementById("modalAviso").style.display = "flex";
                return;
            }

            const tituloModal = document.getElementById("tituloModal");
            const textoModal = document.getElementById("textoModal");
            const tipo = resultado.tipo;

            if (tipo.includes("Entrada")) {
                tituloModal.style.color = "#28a745";
                tituloModal.innerText = "🚀 ¡Excelente Inicio!";
                textoModal.innerText = `¡Hola, ${datos.trabajador}! Tu registro de [${tipo}] fue guardado con éxito. ¡A darlo todo hoy! 💪`;
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            } else {
                tituloModal.style.color = "#007bff";
                tituloModal.innerText = "👏 ¡Gran Trabajo Hoy!";
                textoModal.innerText = `¡Muchas gracias por tu esfuerzo, ${datos.trabajador}! Tu registro de [${tipo}] quedó guardado. ¡Descansa y excelente tarde/noche! ✨`;
                confetti({ particleCount: 80, spread: 60, colors: ['#007bff', '#6c757d', '#ffffff'], origin: { y: 0.6 } });
            }

            document.getElementById("modalExito").style.display = "flex";
        })
        .catch(error => {
            btnEnviar.disabled = false;
            mensaje.style.color = "red";
            mensaje.innerText = "Error de conexión. Intenta de nuevo.";
            console.error(error);
        });
    }

    function cerrarModal() {
        document.getElementById("modalExito").style.display = "none";
        location.reload();
    }

    function cerrarAviso() {
        document.getElementById("modalAviso").style.display = "none";
    }
</script>

</body>
</html>
