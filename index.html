<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistencia FC7</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b132b; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #152244; padding: 30px 20px; border-radius: 20px; text-align: center; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 5px solid #17F1D7; }
        .sede-tag { background: rgba(23, 241, 215, 0.1); color: #17F1D7; padding: 8px 15px; border-radius: 20px; font-size: 15px; font-weight: bold; margin-bottom: 20px; display: inline-block; }
        input[type="text"] { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #3059B6; background: #0b132b; color: #fff; font-size: 16px; text-align: center; margin-bottom: 20px; font-weight: bold; outline: none; box-sizing: border-box; }
        input[type="text"]:disabled { border-color: #555; color: #999; }
        
        .video-box { width: 220px; height: 220px; border-radius: 50%; overflow: hidden; margin: 0 auto 20px; border: 4px solid #17F1D7; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .btn-enviar { background: #17F1D7; color: #0b132b; width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-enviar:disabled { background: #444; color: #888; }
        
        /* Modal Éxito */
        #modalExito { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:1000; }
        .modal-content { background: #152244; padding: 30px; border-radius: 15px; text-align: center; border: 2px solid #17F1D7; width: 90%; max-width: 320px; }
    </style>
</head>
<body>

<div class="card">
    <div class="sede-tag" id="etiquetaSede">📍 Cargando...</div>
    <input type="text" id="nombreTrabajador" placeholder="Apellidos y Nombres">
    
    <div class="video-box">
        <video id="videoStream" autoplay playsinline muted></video>
    </div>
    
    <button class="btn-enviar" id="btnEnviar" onclick="procesarAsistencia()">Registrar Asistencia</button>
    <p id="msjEstado" style="margin-top: 15px; font-size: 14px; color: #17F1D7;"></p>
</div>

<div id="modalExito">
    <div class="modal-content">
        <h2 style="color: #17F1D7; margin-bottom: 10px;">¡Asistencia Registrada!</h2>
        <p style="color: #fff; font-size: 15px; margin-bottom: 20px;">Tu marcación se ha guardado correctamente. ¡Que tengas un excelente día!</p>
        <button class="btn-enviar" onclick="location.reload()">Aceptar</button>
    </div>
</div>

<script>
    // ==========================================
    // ⚙️ PEGA TUS 3 CREDENCIALES AQUÍ
    // ==========================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqLxbWlXL4MYfJOE181YK1ll9d9XRX5RrB03Zr9YkNYXXwQYmh52HFs1qBD6VPUBNW/exec";
    const SUPABASE_URL = "https://fsnvqorgomxmcnuidjux.supabase.co/rest/v1/";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzbnZxb3Jnb214bWNudWlkanV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NTQ3NDksImV4cCI6MjEwODQzMDc0OX0.OTk8mOzNqYYXu1A8fZqIjFEuy3SBSaps18_lae6f6XU";
    // ==========================================

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const params = new URLSearchParams(window.location.search);
    const sedeActual = params.get("sede");

    window.onload = async function() {
        if(!sedeActual) {
            document.getElementById("etiquetaSede").innerText = "⚠️ Error: Escanea el QR oficial.";
            document.getElementById("btnEnviar").disabled = true;
            return;
        }
        document.getElementById("etiquetaSede").innerText = "📍 Sede: " + sedeActual;

        // Limitar a 3 registros de nombre
        const inputNombre = document.getElementById("nombreTrabajador");
        const conteo = parseInt(localStorage.getItem("mark_count") || "0");
        if (localStorage.getItem("worker_name")) inputNombre.value = localStorage.getItem("worker_name");
        if (conteo >= 3) inputNombre.disabled = true;

        // Iniciar Cámara
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById("videoStream").srcObject = stream;
        } catch (err) {
            alert("Debes permitir la cámara para marcar asistencia.");
        }
    };

    async function procesarAsistencia() {
        const nombre = document.getElementById("nombreTrabajador").value.trim().toUpperCase();
        if(!nombre) return alert("Escribe tu nombre.");
        
        document.getElementById("btnEnviar").disabled = true;
        document.getElementById("msjEstado").innerText = "Enviando registro...";

        const video = document.getElementById("videoStream");
        const canvas = document.createElement("canvas");
        canvas.width = 400; canvas.height = 400;
        canvas.getContext("2d").drawImage(video, 0, 0, 400, 400);
        const base64 = canvas.toDataURL("image/jpeg", 0.7).split(",")[1];

        const turno = new Date().getHours() < 14 ? "MAÑANA" : "TARDE";
        let fotoUrl = "";

        // Subir a Drive
        try {
            const reqDrive = await fetch(APPS_SCRIPT_URL, {
                method: "POST", body: JSON.stringify({ sede: sedeActual, trabajador: nombre, fotoBase64: base64 })
            });
            const resDrive = await reqDrive.json();
            if(resDrive.status === "success") fotoUrl = resDrive.url;
        } catch(e) { console.log(e); }

        // Guardar en Base de Datos Supabase
        const { error } = await supabase.from('asistencias').insert([
            { sede: sedeActual, trabajador: nombre, tipo_marca: turno, foto_url: fotoUrl }
        ]);

        if (error) return alert("Error de conexión.");

        // Guardar progreso en el celular
        localStorage.setItem("mark_count", parseInt(localStorage.getItem("mark_count") || "0") + 1);
        localStorage.setItem("worker_name", nombre);

        document.getElementById("modalExito").style.display = "flex";
    }
</script>
</body>
</html>
